[pytest]
testpaths = tests
pythonpath = tests
addopts = -ra --browser chromium --screenshot only-on-failure --video retain-on-failure --output test-results
markers =
    smoke: boot & basic controls
    regression: cross-build collision matrix
    bugs: Jira issue generator
    telemetry: real-time telemetry & scoring
    bot: auto-play bot
    responsive: desktop / mobile layout
